<svg xmlns="http://www.w3.org/2000/svg" width="780" height="396" viewBox="0 0 780 396" role="img" aria-label="Simulation of three requests. The laptop asking localhost answers itself and logs 127.0.0.1. The phone asking localhost dies inside the phone, and the laptop logs nothing. The phone asking the laptop's LAN address crosses the Wi-Fi, and the log's first field is the phone's address."><title>Simulation of three requests. The laptop asking localhost answers itself and logs 127.0.0.1. The phone asking localhost dies inside the phone, and the laptop logs nothing. The phone asking the laptop's LAN address crosses the Wi-Fi, and the log's first field is the phone's address.</title><rect width="780" height="396" fill="#ffffff" rx="12"/><g class="vz vz-box" data-el="lap"><rect x="20" y="20" width="350" height="360" rx="10" fill="#f2f3f5" stroke="#c8cdd7" stroke-width="1.4"/><text x="32" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5c626e" class="vz-box__label">Laptop</text></g><g class="vz vz-box" data-el="lap-browser"><rect x="76" y="56" width="220" height="74" rx="10" fill="#f2f3f5" stroke="#c8cdd7" stroke-width="1.4"/><text x="88" y="76" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5c626e" class="vz-box__label">Browser tab</text></g><g class="vz vz-box" data-el="lap-term" data-tone="term"><rect x="64" y="212" width="286" height="148" rx="10" fill="#14171e" stroke="#14171e" stroke-width="1.4"/><text x="76" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#838c9d" class="vz-box__label">python3 -m http.server 8000</text></g><g class="vz vz-box" data-el="phone"><rect x="560" y="88" width="200" height="292" rx="10" fill="#f2f3f5" stroke="#c8cdd7" stroke-width="1.4"/><text x="572" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#5c626e" class="vz-box__label">Phone</text></g><g class="vz vz-box" data-el="ph-browser" data-state="ok"><rect x="580" y="124" width="160" height="74" rx="10" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.4"/><text x="592" y="144" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1f7a4d" class="vz-box__label">Browser</text></g><g class="vz vz-wire" data-el="lap-loop" data-tone="ghost"><path d="M100 134 L100 194" fill="none" stroke="#dfe2e8" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" class="vz-wire__path"/><polygon points="100,194 102.9,187.6 97.1,187.6" fill="#dfe2e8" class="vz-wire__head"/></g><g class="vz vz-wire" data-el="ph-loop" data-tone="ghost"><path d="M660 202 L660 278" fill="none" stroke="#dfe2e8" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" class="vz-wire__path"/><polygon points="660,278 662.9,271.6 657.1,271.6" fill="#dfe2e8" class="vz-wire__head"/></g><g class="vz vz-wire" data-el="lan" data-state="active"><path d="M352 288 L558 288" fill="none" stroke="#3f7ac4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="vz-wire__path"/><polygon points="558,288 551.2,284.9 551.2,291.1" fill="#3f7ac4" class="vz-wire__head"/><polygon points="352,288 358.8,291.1 358.8,284.9" fill="#3f7ac4" class="vz-wire__head"/></g><g class="vz vz-chip" data-el="door-loop" data-tone="accent"><rect x="71.5" y="194" width="57" height="24" rx="12" fill="#eef3fa" stroke="#3f7ac4" stroke-width="1.4"/><text x="100" y="210" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#3f7ac4" class="vz-mono">:8000</text></g><g class="vz vz-chip" data-el="door-lan" data-tone="accent"><rect x="321.5" y="276" width="57" height="24" rx="12" fill="#eef3fa" stroke="#3f7ac4" stroke-width="1.4"/><text x="350" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#3f7ac4" class="vz-mono">:8000</text></g><g class="vz vz-chip" data-el="lap-ip"><rect x="315.5" y="240" width="109" height="24" rx="12" fill="#f2f3f5" stroke="#c8cdd7" stroke-width="1.4"/><text x="370" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#16181d" class="vz-mono">192.168.1.42</text></g><g class="vz vz-chip" data-el="ph-ip"><rect x="505.5" y="240" width="109" height="24" rx="12" fill="#f2f3f5" stroke="#c8cdd7" stroke-width="1.4"/><text x="560" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#16181d" class="vz-mono">192.168.1.66</text></g><g class="vz vz-chip" data-el="lap-me" data-tone="ghost"><rect x="56.5" y="161" width="87" height="24" rx="12" fill="none" stroke="#dfe2e8" stroke-width="1.4"/><text x="100" y="177" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#868d9b" class="vz-mono">127.0.0.1</text></g><g class="vz vz-chip" data-el="ph-me" data-tone="ghost"><rect x="616.5" y="232" width="87" height="24" rx="12" fill="none" stroke="#dfe2e8" stroke-width="1.4"/><text x="660" y="248" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#868d9b" class="vz-mono">127.0.0.1</text></g><text class="vz vz-text vz-mono" data-el="lap-url" x="86" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#16181d">http://localhost:8000</text><text class="vz vz-text" data-el="lap-status" data-tone="ok" x="86" y="120" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1f7a4d">your page</text><text class="vz vz-text vz-mono" data-el="banner" data-tone="term" x="76" y="256" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#7fd1a0">Serving HTTP on 0.0.0.0 port 8000 ...</text><text class="vz vz-text vz-mono" data-el="log1" data-tone="term" x="76" y="280" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#7fd1a0"><tspan data-tone="term" fill="#7fd1a0">127.0.0.1</tspan><tspan fill="#dfe4ee"> - - &quot;GET / HTTP/1.1&quot; 200 -</tspan></text><text class="vz vz-text vz-mono" data-el="log2" data-tone="term" x="76" y="302" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#7fd1a0"><tspan data-tone="term" fill="#7fd1a0">192.168.1.66</tspan><tspan fill="#dfe4ee"> - - &quot;GET / HTTP/1.1&quot; 200 -</tspan></text><text class="vz vz-text vz-mono" data-el="ph-url" x="588" y="164" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#16181d">http://192.168.1.42:8000</text><text class="vz vz-text" data-el="ph-status" data-state="ok" x="588" y="184" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#16181d">your page</text><text class="vz vz-text" data-el="ph-resolve" data-tone="accent" x="660" y="220" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#3f7ac4">192.168.1.42 — a place, not a name</text><text class="vz vz-text" data-el="ph-noserver" data-tone="ghost" x="660" y="304" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#838c9d">port 8000 — nothing is listening</text><text class="vz vz-text" data-el="lan-label" data-tone="ghost" x="455" y="316" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#838c9d">Wi-Fi — one network: 192.168.1.x</text><g class="vz vz-chip" data-el="resp" data-tone="ok" transform="translate(560 -3)"><rect x="68" y="188" width="64" height="24" rx="12" fill="#e8f5ee" stroke="#1f7a4d" stroke-width="1.4"/><text x="100" y="204" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1f7a4d" class="vz-mono">200 OK</text></g></svg>
